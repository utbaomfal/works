<!DOCTYPE html>
<html>
<head>
  <title>Discord Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LOGIN -->
<div id="loginPage" class="center">
  <div class="box">
    <h2>Login</h2>
    <input id="loginUser" placeholder="username">
    <input id="loginPass" type="password" placeholder="password">
    <button onclick="login()">Login</button>
    <p onclick="showSignup()">Create account</p>
  </div>
</div>

<!-- SIGNUP -->
<div id="signupPage" class="center hidden">
  <div class="box">
    <h2>Signup</h2>
    <input id="suUser" placeholder="username">
    <input id="suPass" type="password" placeholder="password">
    <input id="suBirth" placeholder="dd/mm/yyyy">
    <button onclick="signup()">Create</button>
    <p onclick="showLogin()">Back</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <div class="layout">

    <!-- SERVERS -->
    <div class="servers">
      <div class="server">🏠</div>
      <div class="server">+</div>
    </div>

    <!-- DM LIST -->
    <div class="dms">
      <h3>DMs</h3>
      <div id="userList"></div>
    </div>

    <!-- CHAT -->
    <div class="chat">
      <div id="chatBox"></div>

      <div class="input">
        <input id="msg" placeholder="message...">
        <button onclick="sendMsg()">Send</button>
      </div>
    </div>

    <!-- PROFILE -->
    <div class="profile">
      <h3 id="meName"></h3>
      <p id="status">🟢 Online</p>
    </div>

  </div>
</div>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>

</body>
</html>
